name: Update README cards

# Generates the stats card as static SVGs inside this repo, so the README
# never depends on a public stats server staying online.

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&custom_title=GitHub%20activity&bg_color=151B23&title_color=F0F6FC&text_color=C9D1D9&icon_color=5B9CF6&ring_color=5B9CF6&border_color=3D444D&border_radius=12
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&custom_title=GitHub%20activity&bg_color=F6F8FA&title_color=1F2328&text_color=3B434B&icon_color=2566D9&ring_color=2566D9&border_color=D1D9E0&border_radius=12
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
